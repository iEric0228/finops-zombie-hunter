[project]
name = "finops-zombie-hunter"
version = "1.0.0"
description = "Detects, optionally deletes, and reports unused (zombie) AWS resources."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.34,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

# This is an application (a Lambda handler in src/), not an installable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes/pycodestyle (flake8), isort, bugbear, pyupgrade, simplify, bandit (S).
# Replaces the previous black + flake8 + pylint + bandit stack.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
# UP031: %-formatting is kept intentionally — logging already uses lazy %-args,
# so the module stays consistent rather than mixing %-logging with .format().
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert is expected in tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# boto3 / botocore do not ship complete type information.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
