name: "Code Quality & Linting"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Trivy
        run: |
          VERSION=0.68.2
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH="64bit"; elif [ "$ARCH" = "aarch64" ]; then ARCH="ARM64"; fi
          FILE=trivy_${VERSION}_Linux-${ARCH}.tar.gz
          URL=https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/${FILE}
          echo "Downloading $URL"
          wget -O $FILE $URL || (echo "::error::Failed to download $URL" && exit 1)
          if ! tar tzf $FILE; then
            echo "::error::Downloaded file is not a valid tar.gz archive"
            file $FILE
            head $FILE
            exit 1
          fi
          tar zxvf $FILE
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        id: fmt
        run: |
          echo "## Terraform Format Check" >> $GITHUB_STEP_SUMMARY
          if terraform fmt -check -recursive; then
            echo "All Terraform files are properly formatted" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Format issues found.** Run: \`terraform fmt -recursive\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        working-directory: ./terraform/environments/dev

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/environments/dev

      - name: Terraform Validate
        id: validate
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Terraform Validate" >> $GITHUB_STEP_SUMMARY
          if terraform validate -no-color > validate_output.txt 2>&1; then
            echo "Terraform configuration is valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Validation failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat validate_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        working-directory: ./terraform/environments/dev

      - name: Trivy IaC Scan (Terraform)
        id: trivy
        run: |
          trivy config --exit-code 1 --format sarif --output trivy-results.sarif ./terraform/environments/dev
        continue-on-error: true

      - name: Upload Trivy SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Scan (Trivy)" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.sarif ]; then
            ISSUE=$(jq '.runs[0].results | length' trivy-results.sarif)
            if [ "$ISSUE" -eq 0 ]; then
              echo "No security issues found" >> $GITHUB_STEP_SUMMARY
            else
              echo "**$ISSUE potential security issues found**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Check the Security tab for detailed findings" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Terraform Lint Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Terraform Linting Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.fmt.outcome }}" == "success" ] && [ "${{ steps.validate.outcome }}" == "success" ]; then
            echo "All Terraform linting checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "Some Terraform linting checks failed" >> $GITHUB_STEP_SUMMARY
          fi

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (from lockfile)
        run: uv sync --frozen

      - name: Ruff (format check)
        id: format
        run: |
          echo "## Python Format (ruff)" >> $GITHUB_STEP_SUMMARY
          if uv run ruff format --check src tests; then
            echo "Code is properly formatted" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Formatting issues found.** Run: \`uv run ruff format src tests\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Ruff (lint + security)
        id: lint
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Python Lint (ruff)" >> $GITHUB_STEP_SUMMARY
          if uv run ruff check --output-format=github src tests; then
            echo "No lint issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Lint issues found** — see annotations" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Mypy (strict type check)
        id: mypy
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Type Check (mypy --strict)" >> $GITHUB_STEP_SUMMARY
          if uv run mypy | tee mypy_output.txt; then
            echo "Type check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type errors found**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat mypy_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Pytest (unit tests)
        id: pytest
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Unit Tests (pytest)" >> $GITHUB_STEP_SUMMARY
          if uv run pytest -q | tee pytest_output.txt; then
            echo "All unit tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Unit tests failed**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Python Quality Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### Python Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff format | ${{ steps.format.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff lint | ${{ steps.lint.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mypy | ${{ steps.mypy.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pytest | ${{ steps.pytest.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
